name: Weekly funding scrape

on:
  schedule:
    - cron: "0 10 * * 1"   # every Monday 10:00 UTC (6–7 am Atlantic)
  workflow_dispatch:         # "Run workflow" button for an on-demand refresh

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape funder websites
        run: python scraper/scrape.py

      - name: Commit updated data
        run: |
          git config user.name "funding-radar-bot"
          git config user.email "funding-radar-bot@users.noreply.github.com"
          git add docs/data/opportunities.json
          git diff --cached --quiet || git commit -m "Weekly update $(date -u +%Y-%m-%d)"
          git push
